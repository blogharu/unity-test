name: Unity Game-CI Test Automation

on:
  push:
    branches:
      - main

jobs:
  unity-test-job:
    runs-on: [self-hosted, windows]

    steps:
      # 1. 깃허브에서 내 유니티 코드 내려받기
      - name: Checkout code
        uses: actions/checkout@v4

      # - name: Cahce Library
      #   uses: actions/cache@v3
      #   with:
      #     path: path/to/your/project/Library
      #     key: Library-MyProjectName-TargetPlatform
      #     restore-keys: |
      #       Library-MyProjectName-
      #       Library-
            
      - name: Activation
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          # customImage: 'unityci/editor:2020.1.14f1-base-0'
          projectPath: .
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          # unityVersion: [your desired Unity version]
          # githubToken: ${{ secrets.GITHUB_TOKEN }} # for logging. Set Workflow permissions to Read and write permissions

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test results
          path: artifacts