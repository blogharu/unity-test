name: Unity Game-CI Test Automation

on:
  push:
    branches:
      - main

jobs:
  unity-test-job:
    runs-on: [self-hosted, Windows]

    steps:
      # 1. 깃허브에서 내 유니티 코드 내려받기
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. [핵심] 유니티 에디터를 백그라운드로 켜서 위에서 만든 EditMode 테스트를 실행하는 액션
      - name: Run Unity EditMode Tests
        uses: game-ci/unity-test-runner@v4
        with:
          projectPath: .
          # githubToken: ${{ secrets.GITHUB_TOKEN }}
          testMode: EditMode # 우리가 만든 스크립트가 EditMode용입니다.